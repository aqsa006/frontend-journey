<html>
    <head>
        <title>youtube clone</title>
        <style>
            .thumbnail{
                width: 300px;
                display: block;
            }
            .video-preview{
                width: 300px;
                display: inline-block;
                vertical-align: top;
                margin-right:15px;
            }
            .video-title{
                margin-top: 0px;
                
            }
            .searchbar{
                display: block;
            }
            .channel-picture{
                display: inline-block;
                width: 40px;
                vertical-align: top;
            }
            .video-info{
                display: inline-block;
                width: 200px;
              
            }
            .profile-picture{
                width: 100%;
                border-radius: 100px;
            }
            .thumbnail-row{
                margin-bottom: 12px;
            }
        </style>
    </head>
    <body>
        <input class="searchbar" type="text" placeholder="Search">
        <div class="video-preview">
            <div class="thumbnail-row">            
                <img class="thumbnail" src="thumbnails/thumbnail-1.webp" alt="image1">
            </div>
            <div>
                <div class="channel-picture">
                    <img class="profile-picture" src="channels-pictures/channel-1.jpeg">
                </div>
                <div class="video-info">
                    <p class="video-title">
                        Talking Tech and AI with Google CEO Sundar Pichai!
                    </p>
                    <p class="video-author">
                        Marques Brownlee
                    </p>
                    <p class="video-stats">
                        3.4M views &#183 6 months ago
                    </p>    
                </div>
                    
            </div>
            
        </div>
        <div class="video-preview">
            <img class="thumbnail" src="thumbnails/thumbnail-2.webp" alt="image2">
            <p class="video-title">
                Try Not To Laugh Challenge #9
            </p>
            <p class="video-author">
                Markiplier
            </p>
            <p class="video-stats">
                19M views &#183 4 years ago
            </p>
        </div>
    </body>
