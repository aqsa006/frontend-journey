<html>
    <head>
    <style>
        button{
            height: 36px;
            margin-right: 10px;
            cursor: pointer;
            
        }
        .SUBSCRIBE-button:hover{
            opacity: 0.7;
        }
        .SUBSCRIBE-button:active{
            opacity: 0.4;
        }
        .JOIN-button:hover{
            background-color: rgb(0, 76, 255);
            color: white;

        }
        .JOIN-button:active{
            opacity: 0.4;
        }
        .tweet-button:active{
            opacity: 0.4;
        }
        .tweet-button:hover{
            box-shadow: 5px 7px 10px 1px rgba(0, 0, 0, 0.6);
            
        }
        .SUBSCRIBE-button{
            background-color: rgb(198, 27, 27);
            border: 0cap;
            width: 113px;
            color:white;
            border-radius: 2px;
            transition: opacity 0.5s;
        
        }
        .JOIN-button{
            background-color: white;
            border-color: rgb(0, 76, 255);
            color: rgb(0, 76, 255);
            width: 65px;
            border-radius: 3px;
            border-width: 1px;
            transition: background-color 0.15s ;
        }
        .tweet-button{
            background-color:  rgb(0, 153, 255);
            border: none;
            color: white;
            border-radius: 20px;
            width: 70px;
            font-weight: bold;
            

        }
        
    </style>
    </head>
    <body>
        <button class="SUBSCRIBE-button">SUBSCRIBE</button>
        <button class="JOIN-button">JOIN</button>
        <button class="tweet-button">Tweet</button>
    </body>
</html>
