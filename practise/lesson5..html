<html>
    <head>
        <title>images and input box</title>
        <style>
            .img1{
                width: 300px;
                height:190px;
                object-fit: fill;
                border-radius: 20px;
            }
            .img2{
                width: 200px;
                height: 200px;
                object-position: center;
            }
            .img3{
                width: 200px;
                border-radius: 100px;
            }
            .input1{
                width: 350px;
                height: 25px;
                border-radius: 20px;
                border: none;
                box-shadow: 0px 0px 5px black;
                padding-left: 10px;
            }
        </style>
    </head>
    <body>
        <h2>IMAGES!</h2>
        <img class="img1" src="cat.webp" alt="image of a cat"><br><br>
        <img class="img2" src="cat.webp" alt="image of a cat"><br><br>
        <img class="img3" src="cat.webp" alt="image of a cat">  <br><br>
        <hr>
        <h2>INPUT BOXES!</h2>
        <input type="text" placeholder="Search"><br><br>
        <input type="text" placeholder="Search Googe or type a URL" class="input1"><br><br>
        <p style="margin-bottom: 3px;">Email</p>
        <input type="text"><br>
        <input type="checkbox"><span>By clicking Agree, you agree to the privacy policy.</span>
      

    </body>
</html>
