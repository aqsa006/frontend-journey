<html>
    <head>
        <title>button practise</title>
        <style>
            button{
                height:35px;
                border: none;
                cursor: pointer;
            }
            .uber-button{
                background-color: black;
                color: white;
                width: 140px;
                
            }
            .amazon-button{
                background-color: rgb(255, 216, 20);
                border-radius: 20px;
                width: 170px;
            }
            .github-button{
                background-color: rgb(46,164,79);
                color: white;
                border-radius: 4px;
                width: 70px;
                font-weight: bold;
                font-size: 15px;
            }
            .bootstrap-button1{
                background-color: rgb(121,82,179);
                border-radius: 3px;
                font-weight: bold;
                color: white;
                width: 100px;
                margin-right: 10px;

            }
            .bootstrap-button2{
                border: 1.5px solid;
                border-color: rgb(108,117,125);
                color: rgb(108,117,125);
                background-color: white;
                border-radius: 3px;
                font-weight: bold;
                width: 95px;
            }
            .LinkedIn-button1{
                background-color: rgb(10,102,194);
                font-weight: bold;
                border-radius: 20px;
                width: 210px;
                color: white;

            }
            .LinkedIn-button2{
                background-color: white;
                color: rgb(10,102,194);
                border: 1.5px solid;
                margin-left: 10px;
                border-radius: 20px;
                width: 70px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h2>Uber button</h2>
        <button class="uber-button">Request now</button>
        <br>
        <h2>Amazon button</h2>
        <button class="amazon-button">Add to Cart</button>
        <br>
        <h2>GitHub button</h2>
        <button class="github-button">Sign up</button>
        <br>
        <h2>Bootstrap</h2>
        <button class="bootstrap-button1">Get started</button>
        <button class="bootstrap-button2">Download</button>
        <br>
        <h2>LinkedIn</h2>
        <button class="LinkedIn-button1">Apply on company website</button>
        <button class="LinkedIn-button2">Save</button>

    
    
    </body>
</html>
