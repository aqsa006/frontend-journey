<html>
    <head>
        <title>
            using div
        </title>
        <style>
            .profile-pic{
                width: 120px;
                height: 120px;
                object-fit: cover;
                
            }
            .btn{
                width: 70px;
                font-size: 10px;
                background-color: rgb(0, 89, 255);
                color: white;
                border: none;
                height: 25px;
                margin-left: 4px;
                margin-bottom: 8px;
            }
            .profile{
                display: inline-block;
                box-shadow: 0px 0px 5px black;
                margin-right: 10px;
            }
            .name{
                font-weight: bold;
                padding-left: 4px;
            }
            .mutuals{
                font-size: 14px;
                color: gray;
                padding-left: 2px;
            }
        </style>
    </head>
    <body>
        <div class="profile">
            <img src="cat.webp" class="profile-pic">
            <p class="name">Oliver</p>
            <p class="mutuals">2 mutual friends</p>
            <button class="btn">Add Friend</button>
        </div>
        <div class="profile">
            <img src="cat2.avif" class="profile-pic">
            <p class="name">Mimi</p>
            <p class="mutuals">3 mutual friends</p>
            <button class="btn">Add Friend</button>
        </div>
        <div class="profile">
            <img src="cat3.avif" class="profile-pic">
            <p class="name">Rex</p>
            <p class="mutuals">4 mutual friends</p>
            <button class="btn">Add Friend</button>
        </div>
    </body>
</html>
